server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Фото 5 МБ + multipart-накладные расходы
    client_max_body_size 10m;

    # Хешированные ассеты — длительное кэширование (имена содержат хеш содержимого)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html — без кэша, чтобы новая версия приложения подхватывалась сразу
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API, фото, healthcheck и Swagger проксируются на backend по имени сервиса.
    # ВАЖНО: имя `backend` должно совпадать с именем контейнера в dockhost.yaml / docker-compose.yml
    # (иначе после редеплоя — молчаливые 502).
    location ~ ^/(courts|photos/|health|docs|openapi\.json) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # SPA-fallback: несуществующие пути приложения → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}